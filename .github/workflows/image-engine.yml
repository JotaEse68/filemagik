name: Image Engine quality
on:
  pull_request:
    paths:
      - 'image-engine/**'
      - '.github/workflows/image-engine.yml'
  workflow_dispatch:
jobs:
  image:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: image-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pytest
      - run: python -m compileall -q app.py
      - run: python -m pytest -q tests
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ./image-engine
          file: ./image-engine/Dockerfile
          push: false
          tags: filemagik-image-engine:test
