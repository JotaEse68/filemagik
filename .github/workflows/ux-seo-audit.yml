name: UX and SEO browser audit
concurrency:
  group: browser-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_SITE_URL: https://www.filemagik.com
      CI: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies from committed lockfile
        run: npm ci --no-audit --no-fund
      - name: Generar credenciales de prueba aisladas
        run: |
          owner_pass=$(node -e "process.stdout.write(require('node:crypto').randomBytes(16).toString('hex'))")
          owner_hash=$(printf %s "$owner_pass" | sha256sum | cut -d' ' -f1)
          session_secret=$(node -e "process.stdout.write(require('node:crypto').randomBytes(48).toString('hex'))")
          printf 'FILEMAGIK_E2E_OWNER_PASSWORD=%s\n' "$owner_pass" >> "$GITHUB_ENV"
          printf 'FILEMAGIK_ADMIN_PASSWORD_SHA256=%s\n' "$owner_hash" >> "$GITHUB_ENV"
          printf 'FILEMAGIK_ADMIN_SESSION_SECRET=%s\n' "$session_secret" >> "$GITHUB_ENV"
      - name: Build production
        run: npm run build
      - name: Install Chromium for browser tests
        run: npx playwright install chromium
      - name: Test Spanish conversion flow, all locales, mobile and WCAG
        run: npm run test:e2e
      - name: Upload browser screenshots and traces on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: filemagik-ux-seo-browser-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
      - name: Start website for lab performance measurement
        if: success()
        run: |
          npm run start -- -p 3100 > /tmp/filemagik-next.log 2>&1 &
          for i in $(seq 1 40); do curl -fsS http://127.0.0.1:3100/es > /dev/null && exit 0; sleep 2; done
          cat /tmp/filemagik-next.log
          exit 1
      - name: Lighthouse mobile lab audit
        if: success()
        run: |
          npx --yes lighthouse@12.8.2 http://127.0.0.1:3100/es --chrome-flags="--headless --no-sandbox" --output=json --output-path=/tmp/lighthouse-filemagik.json --quiet
          node -e "const x=require('/tmp/lighthouse-filemagik.json');const a=x.audits;console.log(JSON.stringify({performance:x.categories.performance.score,accessibility:x.categories.accessibility.score,seo:x.categories.seo.score,LCP:a['largest-contentful-paint'].displayValue,CLS:a['cumulative-layout-shift'].displayValue,TBT:a['total-blocking-time'].displayValue},null,2));"
      - name: Save Lighthouse diagnostics
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: filemagik-lighthouse-lab
          path: /tmp/lighthouse-filemagik.json
          retention-days: 7
          if-no-files-found: ignore
