name: FM01 Pin dependency lockfile
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/fm01-generate-lockfile.yml'
permissions:
  contents: write
jobs:
  lockfile:
    if: github.event.pull_request.number == 61 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve npm dependencies without running package scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit the resulting lockfile to the audit branch
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const request = {
            message: 'Pin FileMagik npm dependencies',
            content: fs.readFileSync('package-lock.json').toString('base64'),
            branch: process.env.PR_BRANCH,
          };
          fs.writeFileSync('/tmp/filemagik-lock-request.json', JSON.stringify(request));
          NODE
          gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/package-lock.json" --input /tmp/filemagik-lock-request.json --silent
