name: PDF Engine quality
on:
  pull_request:
    paths:
      - 'pdf-engine/**'
      - 'src/app/api/pdf-engine/**'
      - 'src/components/professional-pdf-option.tsx'
      - 'src/components/converter.tsx'
      - '.github/workflows/pdf-engine.yml'
  workflow_dispatch:
jobs:
  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pdf-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pdf-engine/requirements.txt
      - name: Verify system dependencies and install missing packages only
        run: |
          missing=""
          command -v ffmpeg >/dev/null || missing="$missing ffmpeg"
          command -v 7z >/dev/null || missing="$missing p7zip-full"
          command -v tesseract >/dev/null || missing="$missing tesseract-ocr"
          fc-match DejaVuSans >/dev/null || missing="$missing fonts-dejavu-core"
          ldconfig -p | grep -q 'libarchive.so' || missing="$missing libarchive13"
          if [ -n "$missing" ]; then
            timeout 120s sudo apt-get -o Acquire::Retries=1 update
            timeout 120s sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends $missing tesseract-ocr-eng tesseract-ocr-spa
          fi
          command -v ffmpeg
          command -v 7z
          command -v tesseract
          tesseract --list-langs
      - run: pip install -r requirements.txt pytest reportlab
      - run: python -m compileall -q app.py document.py worker_capacity.py image_worker.py media_worker.py archive_worker.py image_quota.py media_quota.py archive_quota.py ocr_worker.py batch_worker.py native_font.py
      - run: python -m pytest -q tests
      - run: bash tests/smoke-gotenberg.sh
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ./pdf-engine
          file: ./pdf-engine/Dockerfile
          push: false
          tags: filemagik-pdf-engine:test
