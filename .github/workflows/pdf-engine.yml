name: PDF Engine quality
on:
  pull_request:
    paths:
      - 'pdf-engine/**'
      - 'src/app/api/pdf-engine/**'
      - 'src/components/professional-pdf-option.tsx'
      - 'src/components/converter.tsx'
      - '.github/workflows/pdf-engine.yml'
  workflow_dispatch:
jobs:
  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pdf-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pdf-engine/requirements.txt
      - name: Run PDF engine Python tests in its production Docker image
        working-directory: .
        run: |
          docker build -t filemagik-engine-ci -f pdf-engine/Dockerfile pdf-engine
          docker run --rm -v "$PWD/pdf-engine/tests:/app/tests:ro" filemagik-engine-ci sh -c "pip install pytest reportlab && python -m compileall -q app.py document.py worker_capacity.py image_worker.py media_worker.py archive_worker.py image_quota.py media_quota.py archive_quota.py ocr_worker.py batch_worker.py native_font.py && python -m pytest -q tests"
      - name: Install Python integration dependencies
        run: pip install -r requirements.txt pytest reportlab
      - run: FILEMAGIK_ENGINE_CI_IMAGE=filemagik-engine-ci bash tests/smoke-gotenberg.sh
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ./pdf-engine
          file: ./pdf-engine/Dockerfile
          push: false
          tags: filemagik-pdf-engine:test
