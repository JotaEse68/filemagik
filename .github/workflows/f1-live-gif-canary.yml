name: F1 LIVE GIF canary security audit
on:
  pull_request:
    paths:
      - '.github/workflows/f1-live-gif-canary.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check one live capability and unauthenticated rejection
        run: node scripts/f1-production-gates.mjs https://filemagik.vercel.app wave
