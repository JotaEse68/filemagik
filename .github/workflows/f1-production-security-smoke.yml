name: F1 production security smoke
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/f1-production-gates.mjs'
      - '.github/workflows/f1-production-security-smoke.yml'
      - 'src/app/api/worker-engine/route.ts'
  workflow_dispatch:
    inputs:
      mode:
        description: Public capability mode
        type: choice
        options: [off, wave, on]
        default: on
permissions:
  contents: read
jobs:
  public-fail-closed:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify all enabled conversions require Turnstile and reject unverified uploads
        env:
          CHECK_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'on' }}
        run: node scripts/f1-production-gates.mjs https://filemagik.vercel.app "$CHECK_MODE"
