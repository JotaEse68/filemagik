name: Quality
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SITE_URL: https://www.filemagik.com
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Enforce impact matrix and related tests
        if: github.event_name == 'pull_request'
        env:
          FM_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/check-impact.mjs
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - name: Production build on main (PR build is in browser audit)
        if: github.event_name == 'push'
        run: npm run build
