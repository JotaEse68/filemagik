name: Media Engine quality
on:
  pull_request:
    paths:
      - 'media-engine/**'
      - '.github/workflows/media-engine.yml'
  workflow_dispatch:
jobs:
  media:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: media-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -r requirements.txt pytest
      - run: python -m compileall -q app.py
      - run: python -m pytest -q tests
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ./media-engine
          file: ./media-engine/Dockerfile
          push: false
          tags: filemagik-media-engine:test
